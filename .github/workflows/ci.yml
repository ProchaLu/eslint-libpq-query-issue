name: CI
on: push

jobs:
  ci:
    name: Jest Unit Tests, Type Checking, Linting, Playwright End to End Tests
    runs-on: windows-latest
    timeout-minutes: 30
    # TODO: Update environment variables with your own database credentials
    env:
      PGHOST: localhost
      PGDATABASE: winter2025
      PGUSERNAME: winter2025
      PGPASSWORD: winter2025
    steps:
      - name: Install PostgreSQL on Windows
        run: choco install postgresql16 --params "/Password:${{ env.PGPASSWORD }}" -y

      - name: Add PostgreSQL to PATH
        run: echo "C:\Program Files\PostgreSQL\16\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Start PostgreSQL Service
        run: |
          net start postgresql-x64-16
          sc query postgresql-x64-16

      - name: Verify `psql` is Available
        run: |
          echo $env:Path
          psql --version
        env:
          PGPASSWORD: ${{ env.PGPASSWORD }}

      - name: Create Database User
        run: |
          psql -U postgres -c "CREATE USER ${{ env.PGUSERNAME }} WITH PASSWORD '${{ env.PGPASSWORD }}'"
        env:
          PGPASSWORD: ${{ env.PGPASSWORD }}

      - name: Create Database
        run: |
          psql -U postgres -c "CREATE DATABASE ${{ env.PGDATABASE }} OWNER ${{ env.PGUSERNAME }}"
        env:
          PGPASSWORD: ${{ env.PGPASSWORD }}
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      # Use the official setup-node action (sets up Node.js):
      # https://github.com/actions/setup-node
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
      - name: Jest unit tests
        run: pnpm jest
      - name: Run database migrations
        run: pnpm migrate up
      - name: Build Next.js app (types needed for TSC and ESLint)
        run: pnpm build
      - name: Check TypeScript Types
        run: pnpm tsc
      - name: Lint with ESLint
        run: pnpm eslint . --max-warnings 0
      - name: Lint with Stylelint
        run: pnpm stylelint '**/*.{css,scss,less,js,tsx}'
