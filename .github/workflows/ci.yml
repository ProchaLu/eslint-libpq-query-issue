name: CI
on: push

jobs:
  ci:
    name: Jest Unit Tests, Type Checking, Linting, Playwright End to End Tests
    runs-on: windows-latest
    timeout-minutes: 30
    # TODO: Update environment variables with your own database credentials
    env:
      PGHOST: localhost
      PGDATABASE: winter2025
      PGUSERNAME: winter2025
      PGPASSWORD: winter2025
    steps:
      - name: Download PostgreSQL ZIP
        run: |
          Invoke-WebRequest -Uri "https://get.enterprisedb.com/postgresql/postgresql-16.1-1-windows-x64-binaries.zip" -OutFile "postgresql.zip"

      - name: Extract PostgreSQL
        run: |
          Expand-Archive -Path "postgresql.zip" -DestinationPath "C:\pgsql"

      - name: Initialize PostgreSQL Database
        run: |
          C:\pgsql\pgsql\bin\initdb.exe -D C:\pgsql\data --username=postgres --pwfile=<(echo ${{ env.PGPASSWORD }})

      - name: Start PostgreSQL
        run: |
          C:\pgsql\pgsql\bin\pg_ctl.exe -D C:\pgsql\data start

      - name: Verify PostgreSQL
        run: |
          C:\pgsql\pgsql\bin\psql.exe --version

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      # Use the official setup-node action (sets up Node.js):
      # https://github.com/actions/setup-node
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
      - name: Jest unit tests
        run: pnpm jest
      - name: Run database migrations
        run: pnpm migrate up
      - name: Build Next.js app (types needed for TSC and ESLint)
        run: pnpm build
      - name: Check TypeScript Types
        run: pnpm tsc
      - name: Lint with ESLint
        run: pnpm eslint . --max-warnings 0
      - name: Lint with Stylelint
        run: pnpm stylelint '**/*.{css,scss,less,js,tsx}'
